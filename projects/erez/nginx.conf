server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # PWA manifest: short cache is fine, it changes rarely
    location = /manifest.webmanifest {
        add_header Cache-Control "public, max-age=3600";
    }

    # Service worker must never be cached — it drives app updates
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Service-Worker-Allowed "/";
    }

    # Hashed assets (built by Vite) are immutable — cache aggressively
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Everything else: SPA fallback, no aggressive caching
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
