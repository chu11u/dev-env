name: saritelkayam

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        BACKEND_HOST: backend
        BACKEND_PORT: "3001"
    container_name: saritelkayam-frontend
    restart: unless-stopped
    ports:
      - "3006:3000"
    environment:
      - BACKEND_HOST=backend
      - BACKEND_PORT=3001
    depends_on:
      backend:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: saritelkayam-backend
    restart: unless-stopped
    ports:
      - "30061:3001"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://saritelkayam:saritelkayam_password@postgres:5432/saritelkayam
      - NODE_ENV=production
      - ADMIN_PASSWORD=admin123
    volumes:
      - ../../project-data/saritelkayam/uploads:/app/uploads

  postgres:
    image: postgres:16-alpine
    container_name: saritelkayam-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: saritelkayam
      POSTGRES_USER: saritelkayam
      POSTGRES_PASSWORD: saritelkayam_password
    volumes:
      - ../../project-data/saritelkayam/db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saritelkayam"]
      interval: 5s
      timeout: 5s
      retries: 5
