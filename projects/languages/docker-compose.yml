version: "3.8"

services:
  frontend:
    build: ./frontend
    container_name: languages-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3007:3000"

  backend:
    build: ./backend
    container_name: languages-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:30071:3001"
    volumes:
      - ../../project-data/languages/data:/app/data
