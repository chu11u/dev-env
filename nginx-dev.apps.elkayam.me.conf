# Dev Environment - nginx reverse proxy config
# Subdomain: dev.apps.elkayam.me -> code-server
# Place this file at: /etc/nginx/sites-available/dev.apps.elkayam.me.conf

server {
    listen 80;
    listen [::]:80;
    server_name dev.apps.elkayam.me;

     # Logging
    access_log /var/log/nginx/dev.apps.elkayam.me.access.log;
    error_log /var/log/nginx/dev.apps.elkayam.me.error.log;

     # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

     # Proxy to code-server
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_cache_bypass $http_upgrade;

         # Timeouts for WebSocket (needed for code-server)
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
     }
}
