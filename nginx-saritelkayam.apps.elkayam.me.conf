# Sarit Elkayam - nginx reverse proxy config
# Subdomain: saritelkayam.apps.elkayam.me
# Place this file at: /etc/nginx/sites-available/saritelkayam.apps.elkayam.me.conf

server {
    listen 80;
    listen [::]:80;
    server_name saritelkayam.apps.elkayam.me;

    # Logging
    access_log /var/log/nginx/saritelkayam.apps.elkayam.me.access.log;
    error_log /var/log/nginx/saritelkayam.apps.elkayam.me.error.log;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Backend API
    location /api/ {
        proxy_pass http://127.0.0.1:30061;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend
    location / {
        proxy_pass http://127.0.0.1:3006;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_cache_bypass $http_upgrade;
    }
}
