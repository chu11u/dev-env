# Project Template - nginx reverse proxy config
# Copy this file and rename it for each new project
# Place at: /etc/nginx/sites-available/<project>.apps.elkayam.me.conf

# Replace {{PROJECT_NAME}} and {{PROJECT_PORT}} before use

server {
    listen 80;
    listen [::]:80;
    server_name {{PROJECT_NAME}}.apps.elkayam.me;

    access_log /var/log/nginx/{{PROJECT_NAME}}.apps.elkayam.me.access.log;
    error_log /var/log/nginx/{{PROJECT_NAME}}.apps.elkayam.me.error.log;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

     # API routes (if project has a backend)
    location /api/ {
        proxy_pass http://127.0.0.1:{{PROJECT_PORT}}1/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Accept "application/json";
     }

     # Main app
    location / {
        proxy_pass http://127.0.0.1:{{PROJECT_PORT}};
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_cache_bypass $http_upgrade;
     }
}
